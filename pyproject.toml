[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "support-ai"
version = "0.1.0"
description = "Private, Git-grounded technical knowledge"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0.36,<2.1",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
rag = [
    "torch>=2.6,<3",
    "sentence-transformers>=5.1,<6",
    "transformers>=4.57,<5",
    "qdrant-client>=1.15,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
support_ai = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
